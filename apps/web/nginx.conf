server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Uploads (enquiry documents, rate-card workbook) can be a few MB.
  client_max_body_size 25m;

  # API — same-origin reverse proxy to the api container (keeps the auth
  # cookie same-site; no CORS). Browser calls /api/... → api:3093/...
  location /api/ {
    resolver 127.0.0.11 valid=30s;               # docker embedded DNS
    set $api_upstream http://dlogix-api:3093;
    # NOTE: with a VARIABLE in proxy_pass, nginx does NOT strip the location
    # prefix from the URI (a URI after the variable would replace the whole
    # path). So strip /api explicitly with rewrite, then proxy_pass with NO URI.
    rewrite ^/api/(.*)$ /$1 break;               # /api/health -> /health
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # SPA fallback — client-side routing
  location / {
    try_files $uri $uri/ /index.html;
  }

  # cache fingerprinted assets
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
