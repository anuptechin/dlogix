# ── Dlogix — site config for the SHARED nginx proxy (nginx_proxy) ───────────
#
#   cp deploy/nginx/dlogix.ddecor.com.conf /data/nginx-proxy/conf.d/dlogix.conf
#   docker exec nginx_proxy nginx -t
#   docker exec nginx_proxy nginx -s reload
#
# conf.d snippet for the existing `nginx_proxy` container (it owns 80/443).
# Follows the same conventions as colorstudio.conf on this proxy:
#  - one cert/key pair per hostname in /data/nginx-proxy/certs
#    (mounted at /etc/nginx/certs inside the container)
#  - upstream reached by CONTAINER NAME over the shared proxy network
#    (dlogix-web joins that network in docker-compose.prod.yml)
#  - HSTS WITHOUT includeSubDomains (this proxy serves many ddecor.com hosts)
#
# Cert: the .crt MUST be the FULL CHAIN (leaf + intermediates). Since this is a
# wildcard *.ddecor.com, copying the colorstudio cert is fine:
#   cp /data/nginx-proxy/certs/colorstudio.ddecor.com.crt /data/nginx-proxy/certs/dlogix.ddecor.com.crt
#   cp /data/nginx-proxy/certs/colorstudio.ddecor.com.key /data/nginx-proxy/certs/dlogix.ddecor.com.key
#   chmod 640 /data/nginx-proxy/certs/dlogix.ddecor.com.key
#
# If nginx logs "host not found in upstream: dlogix-web", the proxy and
# dlogix-web are not on the same docker network — a compose problem, not this
# file (put dlogix-web on PROXY_NETWORK in docker-compose.prod.yml).
# ─────────────────────────────────────────────────────────────────────────────

upstream dlogix_app {
    # web container serves the SPA and reverse-proxies /api -> dlogix-api:3093.
    server dlogix-web:80;
    keepalive 16;
}

server {
    listen 80;
    server_name dlogix.ddecor.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name dlogix.ddecor.com;

    ssl_certificate     /etc/nginx/certs/dlogix.ddecor.com.crt;   # full chain
    ssl_certificate_key /etc/nginx/certs/dlogix.ddecor.com.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS without includeSubDomains (shared multi-host proxy).
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Enquiry document uploads (multer). Keep >= the app's upload cap.
    client_max_body_size 25M;

    access_log /var/log/nginx/dlogix-access.log;
    error_log  /var/log/nginx/dlogix-error.log;

    location / {
        proxy_pass http://dlogix_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";
        proxy_connect_timeout  30s;
        proxy_send_timeout     120s;
        proxy_read_timeout     120s;
    }
}
