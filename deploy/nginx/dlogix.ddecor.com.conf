# Dlogix vhost for the SHARED nginx (Docker). Add this to the shared nginx's
# conf.d (however your shared nginx includes site configs), then reload it.
#
# Requirements:
#  - The shared nginx container must be on the same docker network as dlogix-web
#    (SHARED_NETWORK) so it can resolve `dlogix-web`.
#  - Wildcard cert for *.ddecor.com mounted into the shared nginx (adjust paths).
#
# If your shared nginx runs on the HOST (not a container), replace
# `http://dlogix-web:80` with `http://127.0.0.1:7079`.

server {
  listen 80;
  server_name dlogix.ddecor.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name dlogix.ddecor.com;

  ssl_certificate     /etc/nginx/certs/ddecor.com/fullchain.pem;   # wildcard *.ddecor.com
  ssl_certificate_key /etc/nginx/certs/ddecor.com/privkey.pem;

  client_max_body_size 25m;

  # security headers
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  location / {
    proxy_pass http://dlogix-web:80;      # or http://127.0.0.1:7079 if shared nginx is on the host
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }
}
